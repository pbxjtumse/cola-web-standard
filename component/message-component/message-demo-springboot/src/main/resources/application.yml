server:
  port: 18081

spring:
  application:
    name: message-demo-springboot

xjtu:
  iron:
    message:
      enabled: true
      # 默认 Provider 只影响 /demo/messages/send；/send/all 会显式指定 providerHint。
      provider: rocketmq

      application-name: ${spring.application.name}
      default-schema-version: "1"
      default-confirm-timeout: 5s
      routing-mode: strict
      serializer:
        type: jackson

      # 同一个逻辑目的地 demo/message，同时配置三条 Provider 路由。
      # 并行发送时通过 MessageDestination.withProviderHint(provider) 精确选择路由。
      routes:
        - namespace: demo
          name: message
          provider: kafka
          physical-name: message-demo-topic
        - namespace: demo
          name: message
          provider: pulsar
          physical-name: persistent://public/default/message-demo-topic
        - namespace: demo
          name: message
          provider: rocketmq
          physical-name: message-demo-topic

      demo:
        auto-subscribe: true
        destination-namespace: demo
        destination-name: message
        consumer-group: message-demo-consumer-group
        # 三 Provider 并行订阅和 /send/all 的目标 Provider 列表。
        providers:
          - kafka
          - pulsar
          - rocketmq

      kafka:
        enabled: true
        bootstrap-servers: www.xjtu-iron.online:31959,www.xjtu-iron.online:31934,www.xjtu-iron.online:31100
        client-id: message-demo-springboot
        poll-timeout: 1s
        consumer-retry-backoff: 1s

      pulsar:
        enabled: true
        service-url: pulsar://pulsar.xjtu-iron.online:6650
        tenant: public
        namespace: default
        operation-timeout: 15s
        negative-ack-redelivery-delay: 2s
        receiver-queue-size: 1000

      rocketmq:
        enabled: true
        name-server: www.xjtu-iron.online:9876
        producer-group: message-demo-producer-group
        consumer-group: message-demo-consumer-group
        topics:
          - message-demo-topic
        send-timeout: 3s
        request-timeout: 3s
        retry-times-when-send-failed: 2
        retry-times-when-send-async-failed: 2
        vip-channel-enabled: false
        consume-from-where: CONSUME_FROM_LAST_OFFSET
        tag-expression: "*"
